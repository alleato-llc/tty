name: CI

on:
  push:
  pull_request:

# Least privilege by default.
permissions:
  contents: read

# A new push to the same ref cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect what changed so each job runs only when relevant: Rust changes build
  # and test the workspace; web changes build the landing page. A pure-docs change
  # matches neither and runs nothing.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'cathode/**'
              - 'phosphor/**'
              - 'tty/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'

  # fmt, clippy, test, and build the tty binary. The GUI pulls in iced + wgpu, so
  # the runner needs the windowing/graphics dev libraries to build. The shared
  # `rime` component kit is a sibling path dependency (../rime/rime), so it is
  # checked out alongside tty into the same workspace.
  rust:
    name: Rust (fmt, clippy, test, build)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tty
        uses: actions/checkout@v4
        with:
          path: tty

      # rime lives in its own repo and is consumed by path (../rime/rime). Lay it
      # down as a sibling so the path dependency resolves. Needs read access to
      # the rime repo: set the RIME_DEPLOY_TOKEN secret (a PAT or deploy token)
      # if it is private; public repos need no token.
      - name: Checkout rime (sibling path dependency)
        uses: actions/checkout@v4
        with:
          repository: alleato-llc/rime
          path: rime
          token: ${{ secrets.RIME_DEPLOY_TOKEN || github.token }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install graphics/windowing libraries (iced + wgpu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev xvfb

      # nextest is the test runner. The default run covers the unit + headless-
      # behavior tiers; the snapshot tests are excluded by the `default-filter`
      # in .config/nextest.toml because their baselines are backend-specific
      # (this Ubuntu runner has no GPU + no committed baselines).
      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tty

      - name: Format
        working-directory: tty
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: tty
        run: cargo clippy --all-targets -- -D warnings

      # Unit + behavior. xvfb gives the `iced_test` Simulator a display to init its
      # renderer on this headless runner. Snapshots are intentionally NOT run here —
      # add a separate macOS/wgpu job with committed baselines to gate those:
      #   cargo nextest run --ignore-default-filter -E 'test(snapshot)'
      - name: Test (unit + behavior)
        working-directory: tty
        run: xvfb-run -a cargo nextest run

      - name: Build
        working-directory: tty
        run: cargo build --bins

  # Build the landing page so a broken site fails CI. No Rust or rime needed.
  web:
    name: Web landing page (build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install
      - run: npm run build
