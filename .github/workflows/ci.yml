name: CI

on:
  push:
  pull_request:

# Least privilege by default.
permissions:
  contents: read

# A new push to the same ref cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect what changed so each job runs only when relevant: Rust changes build
  # and test the workspace; web changes build the landing page. A pure-docs change
  # matches neither and runs nothing.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'cathode/**'
              - 'phosphor/**'
              - 'tty/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'

  # fmt, clippy, test, and build the tty binary. The GUI pulls in iced + wgpu, so
  # the runner needs the windowing/graphics dev libraries to build. The shared
  # `rime` component kit is a sibling path dependency (../rime/rime), so it is
  # checked out alongside tty into the same workspace.
  rust:
    name: Rust (fmt, clippy, test, build)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tty
        uses: actions/checkout@v4
        with:
          path: tty

      # rime lives in its own repo and is consumed by path (../rime/rime). Lay it
      # down as a sibling so the path dependency resolves. Needs read access to
      # the rime repo: set the RIME_DEPLOY_TOKEN secret (a PAT or deploy token)
      # if it is private; public repos need no token.
      - name: Checkout rime (sibling path dependency)
        uses: actions/checkout@v4
        with:
          repository: alleato-llc/rime
          path: rime
          token: ${{ secrets.RIME_DEPLOY_TOKEN || github.token }}

      # dorado-engine supplies encrypted history's Threefish cipher AND all key
      # derivation (Cargo.toml's [workspace.dependencies.dorado-engine]). Public
      # repo, so github.token is enough — no deploy-token fallback needed.
      - name: Checkout dorado (sibling path dependency)
        uses: actions/checkout@v4
        with:
          repository: alleato-llc/dorado
          path: dorado

      # prexp-core is fdtop's system-metrics core, sampled by the status bar
      # (Cargo.toml's [workspace.dependencies.prexp-core]). NOTE: the repo is
      # named `prexp`, but the path dependency expects the directory `fdtop` —
      # hence the mismatched `path:`. Public repo, same as dorado.
      - name: Checkout prexp (sibling path dependency; dir must be `fdtop`)
        uses: actions/checkout@v4
        with:
          repository: alleato-llc/prexp
          path: fdtop

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install graphics/windowing libraries (iced + wgpu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev xvfb

      # nextest is the test runner. The default run (`.config/nextest.toml`'s
      # default-filter) covers unit + behavior; snapshots are run as their own step
      # below, forcing a CI-portable backend. See ADR 0005.
      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tty

      # Scoped to tty's OWN crates, not `--all`: rustfmt's `--all` means "all
      # packages AND their local path-based dependencies", so it walks into the
      # rime / dorado / prexp checkouts and fails tty's CI on formatting in code
      # this repo doesn't own (and can't fix from here). Clippy needs no such
      # scoping — it lints only workspace members, never dependencies.
      - name: Format
        working-directory: tty
        run: cargo fmt -p cathode -p phosphor -p tty --check

      - name: Clippy
        working-directory: tty
        run: cargo clippy --all-targets -- -D warnings

      # Unit + behavior. xvfb gives the `iced_test` Simulator a display to init its
      # renderer on this headless runner (it tries wgpu first, which needs one here).
      - name: Test (unit + behavior)
        working-directory: tty
        run: xvfb-run -a cargo nextest run

      # Snapshots render real pixels, but `iced_test`'s tiny-skia backend is a pure
      # software rasterizer with no GPU/display dependency at all — forcing it via
      # ICED_TEST_BACKEND sidesteps wgpu's GPU-driver-specific output (the reason
      # snapshots were excluded from CI before). tty/snapshots/*-tiny-skia.png were
      # generated in a container matching this runner and verified byte-for-byte
      # reproducible across independent containers — no xvfb needed. See
      # docs/adr/0005-headless-ci-snapshots-and-coverage.md.
      - name: Test (snapshot, tiny-skia)
        working-directory: tty
        env:
          ICED_TEST_BACKEND: tiny-skia
        run: cargo nextest run --ignore-default-filter -E 'test(snapshot)'

      - name: Build
        working-directory: tty
        run: cargo build --bins

  # Coverage via cargo-llvm-cov (workspace-scoped: cathode/phosphor/tty, not rime or
  # upstream deps). Forces the tiny-skia backend for the same reason the snapshot
  # step above does — deterministic, no GPU. Gated at 70% lines (measured ~76% as of
  # the phosphor::input/detach_drag/update.rs/terminal.rs coverage push; the floor
  # leaves headroom for legitimate variance without letting coverage silently erode
  # — raise it further as genuinely-testable gaps close, don't chase 100%: some
  # files here are inherently thin — see ARCHITECTURE.md's Testing section). An HTML
  # report is uploaded so a human can drill into exactly which lines are missed. See
  # docs/adr/0005-headless-ci-snapshots-and-coverage.md.
  coverage:
    name: Coverage (cargo-llvm-cov)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tty
        uses: actions/checkout@v4
        with:
          path: tty

      - name: Checkout rime (sibling path dependency)
        uses: actions/checkout@v4
        with:
          repository: alleato-llc/rime
          path: rime
          token: ${{ secrets.RIME_DEPLOY_TOKEN || github.token }}

      # See the `rust` job above for why dorado and prexp are laid down too.
      - name: Checkout dorado (sibling path dependency)
        uses: actions/checkout@v4
        with:
          repository: alleato-llc/dorado
          path: dorado

      - name: Checkout prexp (sibling path dependency; dir must be `fdtop`)
        uses: actions/checkout@v4
        with:
          repository: alleato-llc/prexp
          path: fdtop

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install graphics/windowing libraries (iced + wgpu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - name: Install nextest + cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: nextest,cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tty
          key: coverage

      # One instrumented test run (unit + behavior + snapshot); `--no-report` defers
      # generating any output so the two report formats below reuse the same
      # profile data instead of re-running the whole suite twice.
      - name: Collect coverage
        working-directory: tty
        env:
          ICED_TEST_BACKEND: tiny-skia
        run: cargo llvm-cov nextest --workspace --ignore-default-filter --no-report

      - name: Coverage summary + threshold gate
        working-directory: tty
        run: cargo llvm-cov report --lcov --output-path lcov.info --fail-under-lines 70

      - name: Coverage HTML report
        working-directory: tty
        if: always()
        run: cargo llvm-cov report --html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html
          path: tty/target/llvm-cov/html/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcov.info
          path: tty/lcov.info

  # Build the landing page so a broken site fails CI. No Rust or rime needed.
  web:
    name: Web landing page (build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install
      - run: npm run build
