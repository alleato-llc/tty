name: Deploy site

# The landing page in web/ deploys to the static host (tty.alleato.dev) on every
# push to main that TOUCHES web/ (or the salpa config). If nothing under web/
# changed, the path filter means this workflow never starts.
#
# Deploy is driven by `salpa deploy` (the house release tool): it builds web/ with
# the node recipe, `aws s3 sync`s web/dist into the bucket, and invalidates the
# CloudFront distribution (found by its alias == the bucket). The bucket and
# invalidate flag live in salpa.yaml, not here.
#
# Auth is short-lived OIDC credentials (no stored keys). Required repository
# config (Settings -> Secrets and variables -> Actions):
#   vars.AWS_REGION              region of the deploy role (e.g. us-east-1)
#   secrets.AWS_SITE_ROLE_ARN    arn of the OIDC deploy role for tty — a SECRET,
#                                not a variable: GitHub auto-redacts secrets
#                                everywhere in logs, which a variable + a manual
#                                ::add-mask:: step does NOT do (the step's own
#                                `env:` block still gets echoed in its log
#                                preamble before the mask takes effect). Don't
#                                revert this to a variable.
#
# salpa itself is pulled as a PINNED prebuilt binary from ghcr (see SALPA_VERSION
# below) rather than `go install`d at @latest — the same arrangement dorado uses.
# Pinning keeps the deploy reproducible and stops a salpa release from breaking
# this repo unannounced. tty is a private repo, so the ghcr package must grant it
# read access (package settings -> Manage Actions access -> add alleato-llc/tty);
# `packages: read` alone is not enough.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "salpa.yaml"
      - ".github/workflows/deploy-site.yml"
  # A new release redeploys the site so web/src/lib/releases.ts picks up the
  # freshly published download links. Without this the build-time resolution
  # goes stale the moment a tag is cut — the same trigger dorado uses.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write # assume the deploy role via OIDC
  contents: read
  packages: read # pull salpa from ghcr

concurrency:
  group: deploy-site
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  SALPA_VERSION: "0.1.13" # pinned salpa release on ghcr (bump deliberately)

jobs:
  deploy:
    name: Build and deploy web/ with salpa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # salpa shells out to npm (build) and aws (sync + invalidate). aws is
      # preinstalled on the runner; node is set up here.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: oras-project/setup-oras@v1

      - name: Fetch salpa
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras pull "ghcr.io/${{ github.repository_owner }}/salpa:${SALPA_VERSION}"
          chmod +x salpa-linux-amd64
          sudo mv salpa-linux-amd64 /usr/local/bin/salpa

      - name: Configure deploy credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_SITE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Builds web/, syncs web/dist to the bucket, invalidates CloudFront —
      # all per salpa.yaml's `deploy:` block.
      #
      # GITHUB_TOKEN authenticates web/src/lib/releases.ts's build-time call to
      # the Releases API, lifting the 60/hr unauthenticated rate limit. The
      # resolver never fails the build without it; the links just degrade to the
      # Releases page.
      - name: Deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: salpa deploy
