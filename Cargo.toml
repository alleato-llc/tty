[profile.dev]
opt-level = 1

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3

[workspace]
members = ["cathode", "phosphor", "tty"]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
chacha20poly1305 = "0.10"
dirs = "5"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
parking_lot = "0.12"
portable-pty = "0.9"
rand = "0.8"
serde_json = "1"
thiserror = "2"
toml = "0.8"
toml_edit = { version = "0.25", features = ["serde"] }
tracing = "0.1"
vte = "0.15"
zeroize = "1"

[workspace.dependencies.iced]
features = [
    "canvas",
    "tokio",
    "advanced",
]
version = "0.14"

# rime is a sibling path dependency, laid down next to this repo (../rime/rime) —
# the same arrangement fed uses. See CLAUDE.md.
[workspace.dependencies.rime]
path = "../rime/rime"

# dorado is a sibling path dependency (../dorado), the same arrangement as rime
# above. Two pieces of dorado-engine are used: the raw-key authenticated
# construction (see tty/src/history/crypto.rs) and the exported `kdf` module
# (see tty/src/history/passphrase.rs — dorado's derive/validate over tty's own
# sidecar). Never dorado's self-contained password container format, whose
# per-file salt would re-run the KDF on every file read.
[workspace.dependencies.dorado-engine]
path = "../dorado/rust/crates/dorado-engine"

# prexp-core is a sibling path dependency (../fdtop), the fdtop process
# explorer's system-metrics core. tty uses only its system-level sampling
# (`ProcessSource::cpu_ticks` / `memory_info`, native on macOS, procfs on
# Linux) to surface machine stats in the status bar. See tty/src/metrics.rs and
# docs/ideas/status-bar-metrics.md.
[workspace.dependencies.prexp-core]
path = "../fdtop/crates/prexp-core"

[workspace.dependencies.chrono]
default-features = false
features = ["clock", "std", "serde"]
version = "0.4"

[workspace.dependencies.serde]
features = ["derive"]
version = "1"

[workspace.dependencies.tokio]
features = ["full"]
version = "1"

[workspace.dependencies.tracing-subscriber]
features = ["env-filter"]
version = "0.3"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
